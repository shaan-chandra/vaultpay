services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the fraud engine's velocity counter. The counter falls back to
  # Postgres when Redis is unreachable, so this is a performance dependency,
  # not a hard one.
  redis:
    image: redis:7-alpine
    container_name: payment-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: